name: Deploy to GitHub Pages

on:
  push:
    # main only. Enabling Pages creates a `github-pages` environment whose
    # deployment-branch policy allows the default branch and nothing else, so
    # listing a feature branch here does not work: the deploy job is rejected
    # before a runner is even assigned (it fails in ~2s with no steps). To
    # preview a branch without merging, widen that policy in
    # Settings → Environments → github-pages first.
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
